<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD - Lista de Compras</title>

    <meta name="description"
        content="Organize suas compras de forma simples e rápida! Aplicativo prático para gerenciar sua lista de supermercado com salvamento automático.">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous" />

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"
        defer></script>
    <script src="script.js" defer></script>
</head>

<body class="bg-light">
    <!-- Main encapsula o conteúdo principal -->
    <main class="container py-5">
        <section class="app w-100 mx-auto">

            <header class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="m-0">Lista de Compras</h4>
            </header>

            <!-- Botão Adicionar (Mantendo sua classe customizada do CSS) -->
            <div id="addNew" data-bs-toggle="modal" data-bs-target="#form" class="mb-5 shadow-sm">
                <span>Adicione um novo item</span>
                <i class="fas fa-plus"></i>
            </div>

            <!-- Cabeçalho da Lista -->
            <h5 class="text-center text-uppercase text-secondary mb-3">Sua Lista</h5>


            <label>Total: </label>
            <p id="total"></p>

            <div class="list-header"> <!-- d-none d-md-grid esconde no mobile pelo Bootstrap -->
                <span></span>
                <span>Nome</span>
                <span>Quantidade</span>
                <span>Categoria</span>
                <span>Comprado</span>
                <span>Ações</span>
            </div>

            <!-- Container onde o JS injeta os itens -->
            <div id="itens"></div>

        </section>

        <!-- Formulário/Modal com as classes do Bootstrap -->
        <form class="modal fade" id="form" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow-lg">

                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title" id="modalLabel">
                            <i class="fas fa-shopping-cart me-2"></i> Adicionar Item
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                            aria-label="Close"></button>
                    </div>

                    <div class="modal-body p-4">
                        <div id="msg" class="text-danger fw-bold mb-3"></div>

                        <!-- Input: Nome -->
                        <div class="mb-3">
                            <label for="inNome" class="form-label fw-bold">Nome do item</label>
                            <input type="text" class="form-control form-control-lg" id="inNome" maxlength="100" placeholder="Ex: Maçã"
                                autocomplete="off" />
                        </div>

                        <!-- Input: Quantidade -->
                        <div class="mb-3">
                            <label for="inQuantidade" class="form-label fw-bold">Quantidade</label>
                            <input type="number" class="form-control form-control-lg" id="inQuantidade"
                                placeholder="Ex: 2" min="1" />
                        </div>

                        <!-- Select: Categoria -->
                        <div class="mb-4">
                            <label for="inCategoria" class="form-label fw-bold">Categoria</label>
                            <select name="Categoria" id="inCategoria" class="form-select form-select-lg">
                                <option value="" selected disabled>Selecione um tipo...</option>
                                <option value="horti frutti">Horti-frutti</option>
                                <option value="bebida">Bebida</option>
                                <option value="limpeza">Produto de Limpeza</option>
                                <option value="higiene">Produto de Higiene Pessoal</option>
                                <option value="carnes">Carnes</option>
                                <option value="padaria">Padaria</option>
                            </select>
                        </div>

                        <!-- Radio Buttons: Status (Comprado) -->
                        <div class="mb-2">
                            <label class="form-label fw-bold d-block">O item já foi comprado?</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="inStatus" id="sim" value="sim" />
                                <label class="form-check-label" for="sim">Sim</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="inStatus" id="nao" value="nao"
                                    checked />
                                <label class="form-check-label" for="nao">Não</label>
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-outline-secondary"
                            data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" id="add" class="btn btn-primary px-4">Salvar Item</button>
                    </div>

                </div>
            </div>
        </form>
    </main>
</body>

</html>
